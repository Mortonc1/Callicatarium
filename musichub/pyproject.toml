[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musichub"
version = "0.1.0"
description = "Self-hosted, persona-based song generator built on Suno's open-source Bark model"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
generate = ["bark @ git+https://github.com/suno-ai/bark.git"]
web = ["fastapi", "uvicorn[standard]", "python-multipart"]
stems = ["demucs"]
transcribe = ["faster-whisper"]
melody = ["audiocraft"]
dev = ["pytest", "httpx"]

[project.scripts]
musichub = "musicgen_personas.cli:main"
musichub-web = "musicgen_personas.web.app:run"

[tool.setuptools.packages.find]
include = ["musicgen_personas*"]

[tool.setuptools.package-data]
musicgen_personas = ["web/static/*"]
