[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicgen-personas"
version = "0.1.0"
description = "Self-hosted, persona-based song generator built on Suno's open-source Bark model"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
generate = ["bark @ git+https://github.com/suno-ai/bark.git"]
dev = ["pytest"]

[project.scripts]
musicgen-personas = "musicgen_personas.cli:main"

[tool.setuptools.packages.find]
include = ["musicgen_personas*"]
